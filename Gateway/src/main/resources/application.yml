server:
  port: ${PORT:8081}

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: finantialweb
              uri: ${BACKEND_URL:http://localhost:8082}
              predicates:
                - Path=/finantialweb/**
              filters:
                - StripPrefix=1

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${ALLOWED_ORIGINS:*}
                allowedHeaders: "*"
                allowedMethods:
                  - POST

management:
  endpoint:
    gateway:
      enabled: ${ROUTE_TABLES_ENABLED:true}

  endpoints:
    web:
      exposure:
        include:
          - "*"